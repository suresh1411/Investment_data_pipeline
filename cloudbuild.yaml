

steps:
  # Deploy the main Airflow DAG
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - cp
      - DAG/Invest_pipeline_dag.py
      - gs://us-central1-investmentdata-1bc85c8e-bucket/dags/

  # Deploy all SQL files
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - cp
      - 'SQL/*.sql'
      - gs://us-central1-investmentdata-1bc85c8e-bucket/dags/SQL/

options:
  logging: CLOUD_LOGGING_ONLY
