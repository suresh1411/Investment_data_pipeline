steps:
  # Deploy the DAG file to the new Cloud Composer environment.
  - id: deploy-investment-dag
    name: gcr.io/cloud-builders/gsutil
    args:
      - cp
      - DAG/Invest_pipeline_dag.py
      - gs://${_COMPOSER_BUCKET}/dags/Invest_pipeline_dag.py

  # Deploy SQL files beside the DAG.
  - id: deploy-sql-files
    name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - rsync
      - -r
      - SQL
      - gs://${_COMPOSER_BUCKET}/dags/SQL

substitutions:
  _COMPOSER_BUCKET: us-central1-sureshdag-135f2b27-bucket

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 600s